<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rrënjët Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1b18; --muted:#6b665d; --line:#ddd7cc; --accent:#b3261e; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --card:#1f1d1a; --ink:#ece8e1; --muted:#a39d92; --line:#3a3631; --accent:#e5534b; --err:#ff7b72; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 360px; }
  .logo { font-size: 36px; line-height: 1; }
  h1 { font-size: 22px; margin: 10px 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  input[type=password] { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
                         background: var(--bg); color: var(--ink); outline: none; }
  input[type=password]:focus { border-color: var(--accent); }
  label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: var(--muted); }
  button { width: 100%; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 9px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 14px; min-height: 21px; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="logo">🧬</div>
  <h1>Rrënjët Explorer</h1>
  <p>Shkruani kodin për ta hapur.<br>Enter the code to open it.</p>
  <input id="pw" type="password" placeholder="Kodi / Code" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
  <label><input id="rem" type="checkbox" checked> Mbaje mend në këtë pajisje / Remember on this device</label>
  <button id="go" type="submit">Hap / Open</button>
  <div class="err" id="err"></div>
</form>

  var STORE = "rrenjet-key-" + SALT;
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var store = {
    get: function () { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
    set: function (v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
    del: function () { try { localStorage.removeItem(STORE); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };

  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function decrypt(raw) {
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) {
    $("err").textContent = "Ky shfletues nuk mbështetet. / This browser is not supported.";
    $("go").disabled = true;
    return;
  }

  var saved = store.get();
  if (saved) decrypt(b64(saved)).then(show, store.del);

  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = $("pw").value.trim().toLowerCase();
    if (!pw) return;
    $("go").disabled = true; $("err").textContent = "";
    var raw;
    derive(pw)
      .then(function (r) { raw = r; return decrypt(r); })
      .then(function (html) {
        if ($("rem").checked) store.set(toB64(raw));
        show(html);
      })
      .catch(function () {
        $("err").textContent = "Kod i gabuar. / Wrong code.";
        $("go").disabled = false; $("pw").select();
